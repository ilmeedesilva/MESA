benchmark: mesa-real-repo-sockshop
version: 1
matching: type_and_service_set
notes:
  - "Real, third-party, multi-repo microservices reference application (\"Sock Shop\", weaveworks/microservices-demo org). Unlike Online Boutique and the Spring sample, which are each a single repository, Sock Shop's 8 core services each live in their own separate GitHub repository under the archived `microservices-demo` org - archived Dec 29 2023 (read-only, no drift risk for reproducibility). Evaluated at the pinned commit SHAs below, copied locally under benchmarks/real-repos/sock-shop (see benchmarks/real-repos/README.md)."
  - "Evaluating this repository surfaced two real, general (not Sock-Shop-specific) bugs, both fixed before this benchmark was finalized: (1) detect_language() picked a service's reported language by checking \"does any file of this extension exist anywhere in the tree\" with a fixed Python-first priority, so a single stray Python BDD test helper (present in every one of these Go/Java services) mislabelled the whole service as Python; fixed with weighted majority voting, matching the approach discovery/service_candidates.py already used correctly (docs: this file's evaluator_notes below). (2) db_type normalization used chained `.replace(\"mongo\", \"mongodb\")`, and since \"mongo\" is a substring of \"mongodb\" itself, a URI that already matched \"mongodb://\" was corrupted into \"mongodbdb://\" - cosmetic on its own, but it obscured the real root cause of a false SHARED_DATABASE finding while debugging it. Both are covered by regression tests: tests/test_pipeline.py::test_detect_language_is_not_hijacked_by_a_single_stray_file and tests/test_pipeline.py::test_db_type_normalization_does_not_double_mongodb."
  - "This repository's original headline result (precision 0.1905, 17 of 21 findings false positive) was different from, and complementary to, Online Boutique and the Spring sample, which both scored precision 1.0. Two further, general (not Sock-Shop-specific) fixes were made in response, and this repository was re-evaluated: (3) `_extract_hard_coded_dependencies` now strips `//` and `/* */` comments before matching (scoped to C-style-comment languages; a `//` immediately preceded by `:` is left alone so a real `http://` URL embedded in live code still gets caught), fixing the CustomerOrder.java example-curl-comment false positives and, as a direct consequence of the same fix, the unrelated modernizr.js CSS-breakpoint misparse (`max-width:768` was itself inside a `//` comment). (4) hard-coded-dependency and database-connection evidence sourced from an `api-spec/`, `mock/`, `mocks/`, or `__mocks__/` directory is now excluded, fixing the Dredd contract-test hook false positives (the SHARED_DATABASE finding and 4 of orders's findings). A fifth, narrower fix - excluding a hard-coded host that matches the owning service's own name (`_is_self_reference`) - fixed front-end's 5 end-to-end-test false positives without needing a directory-name rule, after a first attempt at a broader `test/`/`tests/`/`e2e/`/`spec/` directory exclusion was measured and found to also discard genuine true positives (a Spring service's `src/test` resources, and front-end's own `test/docker-compose.yml`, which is real deployment config, not mock data) - reverted in favour of the narrower, verified-safe rules actually shipped. All four fixes are covered by regression tests: tests/test_pipeline.py::test_hard_coded_dependency_scan_strips_comments_but_keeps_real_urls, ::test_hard_coded_dependency_and_database_evidence_ignored_under_test_tooling_dirs, ::test_hard_coded_dependency_self_reference_is_excluded. Re-measured result: precision/recall/F1 = 1.0000/1.0000/1.0000 (TP=4, FP=0, FN=0), confirmed live via `mesa evaluate benchmarks/real_repo_sockshop.yml` on 2026-09-24."
systems:
  - id: sock-shop
    name: Sock Shop (microservices-demo org - catalogue, carts, orders, payment, shipping, user, queue-master, front-end)
    category: real-world public repository (multi-repo)
    repo_url: https://github.com/microservices-demo/microservices-demo
    manual_review_status: reviewed
    service_paths:
      - real-repos/sock-shop/catalogue
      - real-repos/sock-shop/carts
      - real-repos/sock-shop/orders
      - real-repos/sock-shop/payment
      - real-repos/sock-shop/shipping
      - real-repos/sock-shop/user
      - real-repos/sock-shop/queue-master
      - real-repos/sock-shop/front-end
    service_discovery:
      root: real-repos/sock-shop
      expected_candidates:
        - catalogue
        - carts
        - orders
        - payment
        - shipping
        - user
        - queue-master
        - front-end
    explanation_checks:
      - id: sock-shop-summary
        intent: SCAN_SUMMARY
        question: Summarize this scan simply.
        required_evidence_kinds: [scan]
        expected_phrases: [services]
        min_suggestions: 1
        min_follow_up_questions: 1
        min_limitations: 1
      - id: sock-shop-priority
        intent: PRIORITIZE_FIXES
        question: What should I fix first here?
        required_evidence_kinds: [finding]
        expected_phrases: [first]
        min_suggestions: 2
        min_follow_up_questions: 1
        min_limitations: 1
      - id: sock-shop-finding
        intent: FINDING_EXPLANATION
        question: Explain simply why this should be reviewed.
        finding_type: HARD_CODED_SERVICE_DEPENDENCY
        services: [catalogue]
        required_evidence_kinds: [finding]
        min_suggestions: 1
        min_follow_up_questions: 1
        min_limitations: 1
    evaluator_notes:
      - "True positives (4, all HARD_CODED_SERVICE_DEPENDENCY): catalogue hard-codes its own database DSN default `catalogue_user:default_password@tcp(catalogue-db:3306)/socksdb` as a Go flag default (cmd/cataloguesvc/main.go:48); user hard-codes `user-db:27017` in two of its own real deployment compose files (docker-compose.yml, docker-compose-zipkin.yml); front-end hard-codes `user-db:27017` in its own test/docker-compose.yml. All four are genuine literal addresses embedded in each service's own configuration, not test/mock artifacts."
      - "FIXED - was a false positive - SHARED_DATABASE (carts, orders): MESA originally reported both services sharing `mongodb://localhost/data`. Manually verified this was wrong: each service's real Spring config points at a separate database host (`carts/src/main/resources/application.properties`: `mongodb://${db:carts-db}:27017/data`; `orders/.../application.properties`: `mongodb://${db:orders-db}:27017/data`) - genuinely separate persistence, the correct microservices pattern. MESA's extractor still cannot parse the Spring `${var:default}` placeholder syntax in a database URI (confirmed: DB_PATTERN does not match `mongodb://${db:carts-db}:27017/data`), so this evidence was never the source. The real source was that both services' Dredd API-contract-test hook files (`api-spec/hooks.js`) independently contain the identical literal fallback `process.env.MONGO_ENDPOINT || 'mongodb://localhost:32769/data'` - generic local-testing boilerplate that happens to be byte-identical across services, not evidence of shared production persistence. Fixed by excluding database-connection evidence sourced from an `api-spec/` directory (see the top-level note above); this finding no longer appears."
      - "FIXED - were false positives - HARD_CODED_SERVICE_DEPENDENCY, front-end (6 of front-end's original 7 findings): 1 was `max-width:768`, a CSS media-query breakpoint inside the vendored third-party library `public/js/modernizr.js`, misparsed by the host:port heuristic as a service address - turned out to be inside a `//` comment in that file, so the comment-stripping fix removed it as a side effect. The other 5 were `http://front-end:8080/` appearing in front-end's own CasperJS end-to-end test files (test/e2e/*.js) - front-end hardcoding the URL of the running instance of itself under test, normal E2E test practice, not a cross-service coupling risk. Fixed by the self-reference exclusion (host equals the owning service's own name); front-end's one remaining, genuine finding (`user-db:27017` in `test/docker-compose.yml`) is correctly preserved since it is real deployment config, not test/mock data, and neither new rule targets it."
      - "FIXED - were false positives - HARD_CODED_SERVICE_DEPENDENCY, orders (10 of orders's original 11 findings): 4 were `http://users-orders-mock:80/...` inside `api-spec/hooks.js` - a Dredd API-contract-test mock server address, not a real dependency - fixed by the `api-spec/` directory exclusion. The remaining 6 were `http://localhost:808x/...` inside `src/main/java/.../entities/CustomerOrder.java` lines 12-16 - confirmed entirely inside `//`-prefixed code comments (example curl commands documenting how to call the API by hand), not live code - fixed by the comment-stripping rule, which specifically distinguishes a genuine line comment from a `//` that is part of a URL scheme like `http://` appearing in real code."
      - "A related, structurally different limitation (not a detector bug, and consistent with the same literal-value-only extraction constraint already documented for Online Boutique's Go services): front-end's real calls to catalogue, carts, orders, and user (front-end/api/endpoints.js) are built as `util.format(\"http://catalogue%s\", domain)` - a runtime string, not a literal `http://...` string inside the calling `request.get(...)`/`fetch(...)` site - so none of these genuine, production inter-service calls are visible to MESA's static, literal-value-only call extraction. This likely hides real CHATTY_SERVICE-shaped relationships (front-end calls catalogue via at least 3 distinct routes alone) that a dynamic-URL-aware extractor would surface. Not added to this benchmark's ground_truth: consistent with how the equivalent Online Boutique/Go gap was handled, ground truth here reflects what a reviewer can confirm from the same kind of static evidence MESA itself uses, not omniscient knowledge of the runtime architecture - so this is reported as a named limitation rather than an inflated false-negative count."
    known_limitations:
      - "Discovery precision on this repository is 8/23 = 0.3478 (measured, via `mesa evaluate`) even though recall is 8/8 = 1.0. The two most notable over-triggers, at confidence high enough to be auto-selected by default, are `catalogue-db` and `user-db` (Docker build-context subdirectories containing only a Dockerfile for seeding the corresponding database image, 0.57 confidence each) - the same discovery-false-positive pattern already seen on the Spring sample (config-service's nested resource directory). The remaining ~13 lower-confidence, not-auto-selected candidates are test/tooling directories (`orders/test/json-server`, `front-end/test`, six `*/docker/<service>` subdirectories, five `*/api-spec` directories) that the discovery evaluation metric counts against precision even though a user scanning through the UI would not have them pre-selected - this repository's unusually high ratio of test/tooling subdirectories to real services is the main driver of the low discovery-precision number, not a sign MESA mis-selected services for analysis (all 8 real services were correctly selected by default, see service_discovery above)."
      - "RESOLVED: this repository originally had a genuinely different, and more severe, precision profile than Online Boutique or the Spring sample - 17 of 21 raw findings (81%) were false positives, almost entirely because MESA's heuristics treated test fixtures, API-contract mock files, and source-code comments as equally authoritative to real service configuration. This was named as a concrete, actionable direction for future detector work in an earlier version of this benchmark file and has since been implemented (comment-stripping, api-spec/mock directory exclusion, self-reference exclusion - see the top-level note above); precision on this repository is now 1.0000 with recall unchanged at 1.0000, verified live rather than by loosening the ground truth to match what the detector produces."
      - "Only 8 of Sock Shop's services were evaluated (the 8 with real business logic: catalogue, carts, orders, payment, shipping, user, queue-master, front-end). `edge-router` (API gateway/routing config) and the `orders.NET`/`orders-aws` alternate implementations were excluded as out of scope - the default deployment uses the Java `orders` service evaluated here."
    ground_truth:
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [catalogue]
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [user]
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [user]
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [front-end]
