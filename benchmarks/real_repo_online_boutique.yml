benchmark: mesa-phase-7-real-repo-online-boutique
version: 1
matching: type_and_service_set
notes:
  - Real, third-party, single-repo, multi-language microservice system (Google's "Online Boutique" reference architecture), used for MESA's Phase 7 real-repository evaluation.
  - Evaluated at commit b9a978db9e01f4ad3dca9494a22cb9edc17548fe (2026-09-03), copied locally under benchmarks/real-repos/online-boutique/src (see benchmarks/real-repos/README.md). Only the src/ service source is kept locally; Terraform/Helm/CI content was not needed for static analysis.
systems:
  - id: online-boutique
    name: Online Boutique (GoogleCloudPlatform/microservices-demo)
    category: real-world public repository
    repo_url: https://github.com/GoogleCloudPlatform/microservices-demo
    manual_review_status: reviewed
    service_paths:
      - real-repos/online-boutique/src/adservice
      - real-repos/online-boutique/src/cartservice
      - real-repos/online-boutique/src/checkoutservice
      - real-repos/online-boutique/src/currencyservice
      - real-repos/online-boutique/src/emailservice
      - real-repos/online-boutique/src/frontend
      - real-repos/online-boutique/src/loadgenerator
      - real-repos/online-boutique/src/paymentservice
      - real-repos/online-boutique/src/productcatalogservice
      - real-repos/online-boutique/src/recommendationservice
      - real-repos/online-boutique/src/shippingservice
      - real-repos/online-boutique/src/shoppingassistantservice
    service_discovery:
      root: real-repos/online-boutique/src
      expected_candidates:
        - adservice
        - cartservice
        - checkoutservice
        - currencyservice
        - emailservice
        - frontend
        - loadgenerator
        - paymentservice
        - productcatalogservice
        - recommendationservice
        - shippingservice
        - shoppingassistantservice
    explanation_checks:
      - id: online-boutique-summary
        intent: SCAN_SUMMARY
        question: Summarize this scan simply.
        required_evidence_kinds: [scan]
        expected_phrases: [services]
        min_suggestions: 1
        min_follow_up_questions: 1
        min_limitations: 1
      - id: online-boutique-finding
        intent: FINDING_EXPLANATION
        question: Explain simply why this should be reviewed.
        finding_type: HARD_CODED_SERVICE_DEPENDENCY
        services: [emailservice]
        required_evidence_kinds: [finding]
        min_suggestions: 1
        min_follow_up_questions: 1
        min_limitations: 1
    evaluator_notes:
      - "Real inter-service traffic in this system is almost entirely gRPC calls made from Go services (frontend, checkoutservice, productcatalogservice, shippingservice) and a C# service (cartservice) to each other and to the Python/Node services. MESA gained MVP Go support (`docs/architecture/PHASE_20_GO_LANGUAGE_SUPPORT.md`) — literal-string net/http and grpc.Dial calls, plus HTTP endpoint registrations — but this repository's real Go code reads service addresses from environment variables (e.g. `addr := os.Getenv(\"LISTEN_ADDR\")` then `grpc.NewClient(addr, ...)`), not literal strings, so MESA's static (and necessarily literal-only, per docs/research/THREATS_TO_VALIDITY.md's Internal Validity note) extraction still cannot see these specific calls. Verified: checkoutservice, frontend, productcatalogservice, and shippingservice each extract to 0 endpoints and 0 calls even with Go support enabled. C# (cartservice) is unaffected by this change and remains entirely unsupported."
      - "The 2 HARD_CODED_SERVICE_DEPENDENCY findings (emailservice, recommendationservice) both flag the same literal address: localhost:4317, the OpenTelemetry Collector's gRPC endpoint. This is a standard local observability sidecar address, not a cross-service architectural coupling risk in the sense the finding's remediation guidance implies. Still labeled a true positive (the address is genuinely hard-coded), but as of `docs/architecture/PHASE_18_INFRA_ADDRESS_DOWNGRADE.md`, MESA itself now recognizes localhost:4317 as a well-known OpenTelemetry Collector port and downgrades both findings to LOW severity with a `likely_infrastructure_address` evidence flag and an explanatory limitation, instead of requiring a human evaluator to notice and write down this nuance by hand every time."
      - "adservice is a Java/Gradle service; MESA's service-discovery language voting reported it as language=unknown because it only recognizes pom.xml as a Java manifest signal, not build.gradle. The separate extraction-time language detector (used during analysis, not discovery) does correctly resolve it to Java via a *.java file scan. This is a minor internal inconsistency between the two language-detection code paths, not a functional defect in this evaluation."
    known_limitations:
      - "Service discovery originally missed 2 of 12 real services entirely: frontend (Go) and cartservice (C#), because neither had a manifest filename MESA's discovery heuristic recognized and a bare Dockerfile alone did not clear the 0.24 minimum-confidence cutoff. Fixed for Go in `docs/architecture/PHASE_20_GO_LANGUAGE_SUPPORT.md` by recognizing go.mod as a manifest signal: frontend is now discovered (confidence 0.50) along with checkoutservice/productcatalogservice/shippingservice, which were previously discovered at only 0.35 confidence with language=unknown and are now discovered at 0.63 confidence with language=go. Discovery recall on this repository improved from 10/12 (0.8333) to 11/12 (0.9167). cartservice (C#) remains an unaddressed gap; this step was scoped to Go only."
      - "Zero CHATTY_SERVICE, CYCLIC_DEPENDENCY, SHARED_DATABASE, and GOD_SERVICE findings on this system should not be read as 'MESA confirmed this architecture is clean.' Adding Go call-extraction did not change this: this specific repository's real Go code sources service addresses from environment variables rather than literal strings (a general, documented MESA limitation, not Go-specific — MESA's Python/JS/Java call extraction is equally literal-only). The zero findings reflect what MESA's static, literal-value extraction can see, not an assessment of the full polyglot system, most of which (6 of 12 services) is Go or C#."
      - "This is Google's own reference 'well-architected' demo application, so even within the parseable subset, a near-zero true anti-pattern count is expected and does not by itself demonstrate detector precision or recall under realistic anti-pattern conditions."
    ground_truth:
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [emailservice]
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [recommendationservice]
