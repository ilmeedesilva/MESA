        services: [platform-service]
      - type: HARD_CODED_SERVICE_DEPENDENCY
        services: [platform-service]

  - id: distributed-monolith
    name: Distributed monolith composite
    category: distributed monolith
    notes: Composite benchmark where cyclic dependencies, central platform ownership, and hard-coded service coupling indicate distributed monolith risk.
    service_paths:
      - ../tests/fixtures/god/platform-service
      - ../tests/fixtures/god/order-service
      - ../tests/fixtures/god/billing-service
      - ../tests/fixtures/god/inventory-service
      - ../tests/fixtures/god/user-service
