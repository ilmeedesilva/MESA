[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-analyzer"
dynamic = ["version"]
description = "Static analysis that finds architecture problems in microservice systems (cycles, shared databases, hard-coded service addresses, god services) and checks pull requests for new ones."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "microservices",
  "software-architecture",
  "static-analysis",
  "anti-patterns",
  "architecture-fitness",
  "github-actions",
  "sarif",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Only what the command line needs (`mesa scan`, `mesa ci`, `mesa gate`, ...).
# The web API, its databases and the live AI explainer are optional extras.
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "neo4j>=5.20",
  "psycopg[binary]>=3.2",
]
ai = [
  "anthropic>=1.0",
]
all = [
  "mesa-analyzer[api,ai]",
]
dev = [
  "mesa-analyzer[all]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.16.7,<0.18",
  "mypy>=1.13,<3",
  "types-PyYAML",
  "jsonschema>=4.18",  # validates SARIF output against the official schema
  "build>=1.2",
  "twine>=5.1",
]

[project.urls]
Source = "https://github.com/ilmeedesilva/MESA"
Issues = "https://github.com/ilmeedesilva/MESA/issues"
Documentation = "https://github.com/ilmeedesilva/MESA/tree/main/docs"

[project.scripts]
mesa = "mesa.cli:app"
# Same command under the package name: `mesa` can clash with other tools.
mesa-analyzer = "mesa.cli:app"

[tool.setuptools.dynamic]
version = { attr = "mesa.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Sample services that the benchmarks scan are research inputs: formatting or
# "fixing" them would change the line numbers recorded in findings.
extend-exclude = [
  "tests/fixtures", "benchmarks", "demo-projects", "evaluation-results",
  "tools",  # coursework diagram script, removed by the repository clean-up
]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently widen (or narrow) what CI
# enforces, the way an unpinned `ruff>=0.5` did between 0.15.15 and 0.16.7 here.
# This is the rule set the codebase has actually been written and reviewed
# against; broadening it is a deliberate follow-up, not an incidental one.
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors and pyflakes (the original set)
  "I",    # import sorting
  "B",    # bugbear: likely bugs
  "UP",   # pyupgrade: syntax for the supported Python versions
  "SIM",  # simplifications
  "C4",   # comprehensions
  "RUF",  # ruff-specific checks
]
ignore = [
  "RUF005",  # prefer [*a, b] over a + [b]: purely cosmetic, not worth churning detector code
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as call defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]


[tool.coverage.run]
source = ["mesa"]

[tool.coverage.report]
# Current level is 83%. Raise this as tests are added; never lower it.
fail_under = 82
show_missing = true

[tool.mypy]
python_version = "3.10"
# Type-checked strictly so far: the data models, analysis core and detectors.
# Widen this list (and drop ignore_missing_imports where stubs exist) as other
# packages are made clean.
files = [
  "src/mesa/models.py", "src/mesa/analysis", "src/mesa/detectors",
  "src/mesa/fingerprint.py", "src/mesa/file_walk.py", "src/mesa/discovery",
  "src/mesa/config.py", "src/mesa/scan.py", "src/mesa/ci.py", "src/mesa/reporting", "src/mesa/optional.py",
]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.setuptools.package-data]
mesa = ["storage/migrations/*.sql", "py.typed"]
