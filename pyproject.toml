[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-analyzer"
version = "0.1.0"
description = "Cross-service static analysis tool for detecting microservices architectural anti-patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "networkx>=3.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "anthropic>=1.0",
  "neo4j>=5.20",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.16.7,<0.17",
  "mypy>=1.13,<2",
  "types-PyYAML",
]

[project.scripts]
mesa = "mesa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Sample services that the benchmarks scan are research inputs: formatting or
# "fixing" them would change the line numbers recorded in findings.
extend-exclude = ["tests/fixtures", "benchmarks", "demo-projects", "evaluation-results"]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently widen (or narrow) what CI
# enforces, the way an unpinned `ruff>=0.5` did between 0.15.15 and 0.16.7 here.
# This is the rule set the codebase has actually been written and reviewed
# against; broadening it is a deliberate follow-up, not an incidental one.
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors and pyflakes (the original set)
  "I",    # import sorting
  "B",    # bugbear: likely bugs
  "UP",   # pyupgrade: syntax for the supported Python versions
  "SIM",  # simplifications
  "C4",   # comprehensions
  "RUF",  # ruff-specific checks
]
ignore = [
  "RUF005",  # prefer [*a, b] over a + [b]: purely cosmetic, not worth churning detector code
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as call defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]


[tool.mypy]
python_version = "3.10"
# Type-checked strictly so far: the data models, analysis core and detectors.
# Widen this list (and drop ignore_missing_imports where stubs exist) as other
# packages are made clean.
files = ["src/mesa/models.py", "src/mesa/analysis", "src/mesa/detectors"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.setuptools.package-data]
mesa = ["storage/migrations/*.sql"]
