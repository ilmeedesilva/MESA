<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="960" height="312" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">MESA analysis pipeline</title>
  <desc id="desc">Six stages: repository ingestion, service discovery, static fact extraction, architecture graph, anti-pattern detectors, and evidence and governance. Repositories go in read-only; findings, scores and a pass/fail gate come out.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .box-key { fill: #ddf4ff; stroke: #54aeff; stroke-width: 2; }
    .num { fill: #0969da; font-size: 13px; font-weight: 700; }
    .head { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 12px; }
    .io { fill: #59636e; font-size: 13px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .tip { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .box-key { fill: #0c2d4b; stroke: #388bfd; }
      .num { fill: #4493f8; }
      .head { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .io { fill: #9198a1; }
      .arrow { stroke: #656c76; }
      .tip { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="312"/>

  <text class="io" x="40" y="34">IN: repositories, archives or GitHub URLs (read-only, never executed)</text>

  <!-- Row 1: stages 1-3, left to right -->
  <rect class="box" x="40" y="52" width="260" height="92" rx="10"/>
  <text class="num" x="58" y="78">1</text>
  <text class="head" x="76" y="78">Ingestion</text>
  <text class="sub" x="58" y="102">Local path, zip/tar or GitHub URL</text>
  <text class="sub" x="58" y="122">Size, path and link checks</text>

  <rect class="box" x="350" y="52" width="260" height="92" rx="10"/>
  <text class="num" x="368" y="78">2</text>
  <text class="head" x="386" y="78">Service discovery</text>
  <text class="sub" x="368" y="102">Manifests, entry points, Dockerfiles,</text>
  <text class="sub" x="368" y="122">OpenAPI, ports; user confirms</text>

  <rect class="box" x="660" y="52" width="260" height="92" rx="10"/>
  <text class="num" x="678" y="78">3</text>
  <text class="head" x="696" y="78">Fact extraction</text>
  <text class="sub" x="678" y="102">Endpoints, calls, DB keys, brokers,</text>
  <text class="sub" x="678" y="122">literal URLs, each with file and line</text>

  <!-- Row 2: stages 4-6, right to left -->
  <rect class="box" x="660" y="180" width="260" height="92" rx="10"/>
  <text class="num" x="678" y="206">4</text>
  <text class="head" x="696" y="206">Architecture graph</text>
  <text class="sub" x="678" y="230">Services and databases as a</text>
  <text class="sub" x="678" y="250">NetworkX multigraph; Neo4j per scan</text>

  <rect class="box-key" x="350" y="180" width="260" height="92" rx="10"/>
  <text class="num" x="368" y="206">5</text>
  <text class="head" x="386" y="206">Anti-pattern detectors</text>
  <text class="sub" x="368" y="230">Cycles, shared database, chatty,</text>
  <text class="sub" x="368" y="250">hard-coded address, God Service</text>

  <rect class="box" x="40" y="180" width="260" height="92" rx="10"/>
  <text class="num" x="58" y="206">6</text>
  <text class="head" x="76" y="206">Evidence and governance</text>
  <text class="sub" x="58" y="230">Findings, health score, roadmap,</text>
  <text class="sub" x="58" y="250">policies, pass/fail gate for CI</text>

  <!-- Arrows -->
  <line class="arrow" x1="300" y1="98" x2="346" y2="98" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="610" y1="98" x2="656" y2="98" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="790" y1="144" x2="790" y2="176" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="660" y1="226" x2="614" y2="226" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="350" y1="226" x2="304" y2="226" marker-end="url(#arrowhead)"/>

  <text class="io" x="40" y="294">OUT: findings with evidence, scores, recommendations, gate result (CLI, API, web UI)</text>
</svg>
