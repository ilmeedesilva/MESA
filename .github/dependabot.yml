version: 2

# Monthly checks, one grouped PR per ecosystem.
# pip and npm: major version bumps are ignored. They usually need code or config changes
# (and matching plugin releases), so they are done deliberately, not by Dependabot.
# GitHub Actions: majors are kept, because action majors rarely need changes here.
# Security updates are enabled in repository settings and do not follow the schedule,
# grouping or PR limit below. The `ignore` rules do apply to them, so a security fix that
# needs a major bump gets a Dependabot alert but no automatic PR.

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
