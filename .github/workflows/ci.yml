name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No machine-specific paths or case-only path clashes
        run: python scripts/check_repo_paths.py

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test with coverage floor
        run: pytest --cov=mesa --cov-report=term-missing

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      # Install the wheel alone (no extras) into a clean environment, outside the
      # repository, and check that the command line works without the API and AI
      # packages.
      - name: Core install from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv core
          core/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          core/bin/python - <<'PY'
          import importlib.util, sys
          extras = ["fastapi", "uvicorn", "neo4j", "psycopg", "anthropic"]
          installed = [name for name in extras if importlib.util.find_spec(name)]
          sys.exit(f"optional packages in the core install: {installed}" if installed else 0)
          PY
          core/bin/mesa-analyzer --version
          core/bin/mesa scan "$GITHUB_WORKSPACE/demo-projects/myservice-broken" --format json > scan.json
          core/bin/python -c "import json; s = json.load(open('scan.json'))['summary']; assert s['finding_count'] == 26, s"
      - name: Install from the sdist
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv from-sdist
          from-sdist/bin/pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          from-sdist/bin/mesa --version

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds on GitHub's amd64 runners; nothing is pushed.
      - name: Build the API image
        run: docker build --tag mesa-api:ci .
      - name: Build the frontend image
        run: docker build --tag mesa-frontend:ci --file frontend/Dockerfile .
      - name: API image starts
        run: |
          docker run --detach --name mesa-api --publish 8000:8000 mesa-api:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs mesa-api
          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (from lockfile)
        run: npm ci
      - name: Lint and type check
        run: npm run lint
      # `npm run lint` regenerates src/generated-docs.ts from docs/ first. The
      # committed copy must match, or the embedded demo docs are out of date.
      - name: Embedded docs are up to date
        run: git diff --exit-code -- src/generated-docs.ts || { echo "::error file=frontend/src/generated-docs.ts::Out of date. Run 'node scripts/generate-docs-bundle.mjs' in frontend/ and commit the result."; exit 1; }
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (from lockfile)
        run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      # Layout at 390-1440px, navigation and accessibility (axe), against the built app with
      # its embedded demo data. No backend and no external network.
      - name: Browser tests
        run: npx playwright test
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
