name: Release to PyPI

# Runs only when started by hand (Actions tab -> "Release to PyPI" -> Run workflow).
# By default it is a dry run: it builds and checks the package and uploads
# nothing. Publishing needs `publish: true`, a version that is not a .dev
# version for PyPI, and a trusted publisher set up on (Test)PyPI for this
# repository and the matching environment. No token is stored in the repository.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish:
        description: "Upload the package (leave off for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Read the version
        id: version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/mesa/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/mesa-analyzer --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Refuse development versions on PyPI
        if: ${{ inputs.target == 'pypi' && contains(needs.build.outputs.version, 'dev') }}
        run: |
          echo "::error::${{ needs.build.outputs.version }} is a development version; set a release version first."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
