services:
  api:
    platform: ${MESA_DOCKER_PLATFORM:-linux/arm64}
    build: .
    ports:
      - "8000:8000"
    environment:
      MESA_POSTGRES_DSN: postgresql://mesa:mesa@postgres:5432/mesa
      MESA_PERSISTENCE: postgres
      MESA_NEO4J_ENABLED: "true"
      MESA_NEO4J_URI: bolt://neo4j:7687
      MESA_NEO4J_USER: neo4j
      MESA_NEO4J_PASSWORD: mesa-password
      MESA_AI_MODE: ${MESA_AI_MODE:-grounded}
      MESA_OPENAI_API_KEY: ${MESA_OPENAI_API_KEY:-}
      MESA_OPENAI_MODEL: ${MESA_OPENAI_MODEL:-gpt-5.4-mini}
      MESA_OPENAI_BASE_URL: ${MESA_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MESA_OPENAI_TIMEOUT_SECONDS: ${MESA_OPENAI_TIMEOUT_SECONDS:-20}
      MESA_AI_PROVIDER: ${MESA_AI_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MESA_ANTHROPIC_EXPLAINER_MODEL: ${MESA_ANTHROPIC_EXPLAINER_MODEL:-claude-opus-5-5}
      MESA_ANTHROPIC_EFFORT: ${MESA_ANTHROPIC_EFFORT:-low}
      MESA_WORKSPACE_ROOT: /workspace
    volumes:
      - .:/workspace:ro
    depends_on:
      - postgres
      - neo4j

  frontend:
    platform: ${MESA_DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    platform: ${MESA_DOCKER_PLATFORM:-linux/arm64}
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  neo4j:
    platform: ${MESA_DOCKER_PLATFORM:-linux/arm64}
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/mesa-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  postgres-data:
  neo4j-data:
