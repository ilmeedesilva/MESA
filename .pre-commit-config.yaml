# Install once with `pip install pre-commit && pre-commit install`.
# Run on everything with `pre-commit run --all-files`.

# Benchmark inputs and research results must stay byte-for-byte as recorded.
exclude: ^(tests/fixtures/|benchmarks/|demo-projects/|evaluation-results/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
